<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1116" width="900" height="1116" font-family="Arial, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="STLO / Vector Thresholds"><rect x="0" y="0" width="900" height="1116" rx="0" fill="#f2f6f4" stroke="none" stroke-width="2"/><rect x="38" y="29" width="10" height="63" rx="5" fill="#557e70" stroke="none" stroke-width="2"/><text x="68" y="55" font-size="33" fill="#243632" font-weight="650">벡터 유사도 임계값 · 선택 기능</text><text x="69" y="88" font-size="23" fill="#65746f" font-weight="400">Lorebook Ordering: Curator · Vector thresholds</text><rect x="38" y="115" width="824" height="234" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="155" font-size="27" fill="#243632" font-weight="650">전역 임계값 사용</text><text x="64" y="189" font-size="24" fill="#557e70" font-weight="650">Use the global threshold</text><text x="64" y="225" font-size="23" fill="#65746f" font-weight="400">칸을 비우면 실리태번의 전역 설정을 사용합니다.</text><text x="64" y="256" font-size="22" fill="#65746f" font-weight="400">Leave the field empty; keep the native threshold.</text><rect x="64" y="282" width="325" height="41" rx="8" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="76" y="310" font-size="22" fill="#557e70" font-weight="650">Blank / 미입력</text><rect x="405" y="282" width="430" height="41" rx="8" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="417" y="310" font-size="22" fill="#557e70" font-weight="650">One query / 단일 검색 요청</text><rect x="38" y="369" width="824" height="289" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="409" font-size="27" fill="#243632" font-weight="650">로어북별로 다른 유사도 임계값</text><text x="64" y="443" font-size="24" fill="#557e70" font-weight="650">Different thresholds by lorebook</text><rect x="64" y="467" width="365" height="41" rx="8" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="76" y="495" font-size="22" fill="#557e70" font-weight="650">Memory / 메모리  0.35</text><rect x="449" y="467" width="385" height="41" rx="8" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="461" y="495" font-size="22" fill="#557e70" font-weight="650">World lore / 세계관  0.60</text><text x="64" y="552" font-size="23" fill="#65746f" font-weight="400">설정 예시: 서로 다른 값끼리 검색 요청을 나눕니다.</text><text x="64" y="583" font-size="22" fill="#65746f" font-weight="400">Example only: distinct values create query groups.</text><text x="64" y="625" font-size="25" fill="#557e70" font-weight="650">Range / 입력 범위  0–1</text><rect x="38" y="678" width="824" height="204" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="718" font-size="27" fill="#243632" font-weight="650">검색 최대 항목 수는 전역 한도 공유</text><text x="64" y="752" font-size="24" fill="#557e70" font-weight="650">One global result cap</text><text x="64" y="790" font-size="23" fill="#65746f" font-weight="400">분리 결과는 순환 배분으로 합치며 점수 재정렬은 하지 않음.</text><text x="64" y="821" font-size="22" fill="#65746f" font-weight="400">Split results are merged by round-robin, not score.</text><text x="64" y="854" font-size="22" fill="#557e70" font-weight="650">Same threshold → one query / 같은 값 → 단일 요청</text><rect x="38" y="902" width="824" height="190" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="942" font-size="27" fill="#243632" font-weight="650">검색 조건 ≠ 토큰 예산</text><text x="64" y="976" font-size="24" fill="#557e70" font-weight="650">Retrieval ≠ token budget</text><text x="64" y="1014" font-size="23" fill="#65746f" font-weight="400">임계값은 검색 후보를, 예산은 주입 최대량을 제한합니다.</text><text x="64" y="1045" font-size="22" fill="#65746f" font-weight="400">Threshold selects candidates; budget limits injection.</text><text x="64" y="1075" font-size="20" fill="#9a6938" font-weight="650">More queries may cost more / 요청 증가 시 비용·시간 증가 가능</text></svg>