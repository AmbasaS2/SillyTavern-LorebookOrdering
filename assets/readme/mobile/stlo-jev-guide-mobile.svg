<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" font-family="Arial, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="STLO / Jev Recall"><rect x="0" y="0" width="900" height="1400" rx="0" fill="#f2f6f4" stroke="none" stroke-width="2"/><rect x="38" y="29" width="10" height="63" rx="5" fill="#557e70" stroke="none" stroke-width="2"/><text x="68" y="55" font-size="33" fill="#243632" font-weight="650">STLO / Jev Recall</text><text x="69" y="88" font-size="23" fill="#65746f" font-weight="400">장면에 필요한 기억을 판정해 불러오기</text><rect x="38" y="115" width="824" height="177" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="154" font-size="27" fill="#243632" font-weight="650">01  Read the current scene</text><text x="64" y="188" font-size="24" fill="#557e70" font-weight="650">현재 장면 읽기</text><text x="64" y="225" font-size="23" fill="#65746f" font-weight="400">Example: the character is avoiding an apology.</text><text x="64" y="256" font-size="22" fill="#65746f" font-weight="400">예시: 캐릭터가 사과를 회피하는 장면입니다.</text><rect x="38" y="312" width="824" height="330" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="351" font-size="27" fill="#243632" font-weight="650">02  Jev judges each eligible lore entry</text><text x="64" y="385" font-size="24" fill="#557e70" font-weight="650">제브가 대상 로어마다 주입 여부를 판정</text><rect x="64" y="408" width="772" height="92" rx="10" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="80" y="441" font-size="20" fill="#557e70" font-weight="650">INCLUDE / 선택</text><text x="300" y="441" font-size="22" fill="#243632" font-weight="650">An old promise not to lie</text><text x="300" y="473" font-size="21" fill="#65746f" font-weight="400">거짓말하지 않겠다는 과거의 약속</text><rect x="64" y="513" width="772" height="92" rx="10" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="80" y="546" font-size="20" fill="#65746f" font-weight="650">SKIP / 제외</text><text x="300" y="546" font-size="22" fill="#243632" font-weight="650">A recipe from an unrelated scene</text><text x="300" y="578" font-size="21" fill="#65746f" font-weight="400">현재 장면과 무관한 요리 레시피</text><rect x="38" y="662" width="824" height="205" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="701" font-size="27" fill="#243632" font-weight="650">03  Keep what fits the budgets</text><text x="64" y="735" font-size="24" fill="#557e70" font-weight="650">예산에 맞는 로어만 주입</text><text x="64" y="772" font-size="23" fill="#65746f" font-weight="400">Always-on first → Jev picks in relevance order</text><text x="64" y="803" font-size="22" fill="#65746f" font-weight="400">상시 주입 먼저 계산 → 제브의 판정 점수순 선택</text><text x="64" y="843" font-size="21" fill="#557e70" font-weight="650">Shared WI + book + Jev caps / 전체·개별·제브 예산 적용</text><rect x="38" y="887" width="824" height="198" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="926" font-size="27" fill="#243632" font-weight="650">04  Your usual RP model replies</text><text x="64" y="960" font-size="24" fill="#557e70" font-weight="650">평소 사용하던 RP 모델이 답변</text><text x="64" y="997" font-size="23" fill="#65746f" font-weight="400">Jev selects lore; it does not write the reply.</text><text x="64" y="1028" font-size="22" fill="#65746f" font-weight="400">제브는 로어를 고르며 RP 답변을 작성하지 않습니다.</text><rect x="38" y="1105" width="824" height="230" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="1144" font-size="27" fill="#243632" font-weight="650">One recall path per reply</text><text x="64" y="1178" font-size="24" fill="#557e70" font-weight="650">답변마다 제브 또는 기존 벡터 검색</text><text x="64" y="1215" font-size="23" fill="#65746f" font-weight="400">Jev enabled: native vector retrieval is skipped.</text><text x="64" y="1246" font-size="22" fill="#65746f" font-weight="400">제브 사용 시 기본 벡터 검색을 건너뜁니다.</text><text x="64" y="1285" font-size="21" fill="#9a6938" font-weight="650">If Jev fails: native keywords / 실패 시 기존 키워드 검색</text><text x="42" y="1377" font-size="20" fill="#65746f" font-weight="400">Illustrated workflow / 설명용 구성도 · TypeSafe Jev 1.14 via NanoGPT</text></svg>