<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" font-family="Arial, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="STLO / Jev Recall"><rect x="0" y="0" width="900" height="1400" rx="0" fill="#f2f6f4" stroke="none" stroke-width="2"/><rect x="38" y="29" width="10" height="63" rx="5" fill="#557e70" stroke="none" stroke-width="2"/><text x="68" y="55" font-size="33" fill="#243632" font-weight="650">장면에 필요한 기억을 판정해 불러오기</text><text x="69" y="88" font-size="23" fill="#65746f" font-weight="400">Lorebook Ordering: Curator · Jev recall</text><rect x="38" y="115" width="824" height="177" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="154" font-size="27" fill="#243632" font-weight="650">01  현재 장면 읽기</text><text x="64" y="188" font-size="24" fill="#557e70" font-weight="650">01  Read the current scene</text><text x="64" y="225" font-size="23" fill="#65746f" font-weight="400">예시: 캐릭터가 사과를 회피하는 장면입니다.</text><text x="64" y="256" font-size="22" fill="#65746f" font-weight="400">Example: the character is avoiding an apology.</text><rect x="38" y="312" width="824" height="330" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="351" font-size="27" fill="#243632" font-weight="650">02  Jev가 대상 로어마다 주입 여부를 판정</text><text x="64" y="385" font-size="24" fill="#557e70" font-weight="650">02  Jev judges each eligible lore entry</text><rect x="64" y="408" width="772" height="92" rx="10" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="80" y="441" font-size="20" fill="#557e70" font-weight="650">INCLUDE / 선택</text><text x="300" y="441" font-size="22" fill="#243632" font-weight="650">거짓말하지 않겠다는 과거의 약속</text><text x="300" y="473" font-size="21" fill="#65746f" font-weight="400">An old promise not to lie</text><rect x="64" y="513" width="772" height="92" rx="10" fill="#e5eee9" stroke="none" stroke-width="2"/><text x="80" y="546" font-size="20" fill="#65746f" font-weight="650">SKIP / 제외</text><text x="300" y="546" font-size="22" fill="#243632" font-weight="650">현재 장면과 무관한 요리 레시피</text><text x="300" y="578" font-size="21" fill="#65746f" font-weight="400">A recipe from an unrelated scene</text><rect x="38" y="662" width="824" height="205" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="701" font-size="27" fill="#243632" font-weight="650">03  예산에 맞는 로어만 주입</text><text x="64" y="735" font-size="24" fill="#557e70" font-weight="650">03  Keep what fits the budgets</text><text x="64" y="772" font-size="23" fill="#65746f" font-weight="400">상시 주입 → 책별 우선 배정 → 관련성 순서</text><text x="64" y="803" font-size="22" fill="#65746f" font-weight="400">Always-on → book allocations → relevance</text><text x="64" y="843" font-size="21" fill="#557e70" font-weight="650">Shared WI + book + Jev caps / 전체·개별·Jev 예산 적용</text><rect x="38" y="887" width="824" height="198" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="926" font-size="27" fill="#243632" font-weight="650">04  평소 사용하던 RP 모델이 답변</text><text x="64" y="960" font-size="24" fill="#557e70" font-weight="650">04  Your usual RP model replies</text><text x="64" y="997" font-size="23" fill="#65746f" font-weight="400">Jev는 로어를 고르며 RP 답변을 작성하지 않습니다.</text><text x="64" y="1028" font-size="22" fill="#65746f" font-weight="400">Jev selects lore; it does not write the reply.</text><rect x="38" y="1105" width="824" height="230" rx="18" fill="#ffffff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="1144" font-size="27" fill="#243632" font-weight="650">Jev 및 기존 검색 범위 구분</text><text x="64" y="1178" font-size="24" fill="#557e70" font-weight="650">One recall path per reply</text><text x="64" y="1215" font-size="23" fill="#65746f" font-weight="400">전체 모드: Jev 적용 책의 일반 벡터 검색 대체</text><text x="64" y="1246" font-size="22" fill="#65746f" font-weight="400">All mode: Jev replaces managed lore recall.</text><text x="64" y="1285" font-size="21" fill="#9a6938" font-weight="650">If Jev fails: retry or cancel / 실패 시 재시도 또는 취소</text><text x="42" y="1377" font-size="20" fill="#65746f" font-weight="400">TypeSafe Jev 1.14 · NanoGPT</text></svg>