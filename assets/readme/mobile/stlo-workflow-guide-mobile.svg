<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1035" width="900" height="1035" font-family="Arial, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="STLO / Setup Flow"><rect x="0" y="0" width="900" height="1035" rx="0" fill="#f2f6f4" stroke="none" stroke-width="2"/><rect x="38" y="29" width="10" height="63" rx="5" fill="#557e70" stroke="none" stroke-width="2"/><text x="68" y="55" font-size="33" fill="#243632" font-weight="650">STLO / Setup Flow</text><text x="69" y="88" font-size="23" fill="#65746f" font-weight="400">설정 흐름 · AmbasaS2 fork</text><rect x="38" y="115" width="824" height="163" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><rect x="60" y="138" width="60" height="60" rx="13" fill="#557e70" stroke="none" stroke-width="2"/><text x="74" y="178" font-size="26" fill="#fff" font-weight="650">01</text><text x="143" y="155" font-size="27" fill="#243632" font-weight="650">Open from Extensions</text><text x="143" y="189" font-size="24" fill="#557e70" font-weight="650">확장 메뉴에서 열기</text><text x="143" y="220" font-size="23" fill="#65746f" font-weight="400">Lorebook Budget Management → select a book</text><text x="143" y="251" font-size="22" fill="#65746f" font-weight="400">로어북 예산 관리 → 로어북 선택</text><rect x="38" y="296" width="824" height="163" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><rect x="60" y="319" width="60" height="60" rx="13" fill="#557e70" stroke="none" stroke-width="2"/><text x="74" y="359" font-size="26" fill="#fff" font-weight="650">02</text><text x="143" y="336" font-size="27" fill="#243632" font-weight="650">Choose a priority</text><text x="143" y="370" font-size="24" fill="#557e70" font-weight="650">로어북 우선순위</text><text x="143" y="401" font-size="23" fill="#65746f" font-weight="400">1–5 · default 3; optional order adjustment</text><text x="143" y="432" font-size="22" fill="#65746f" font-weight="400">1~5 · 기본 3; 세부 순서 조정 선택</text><rect x="38" y="477" width="824" height="163" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><rect x="60" y="500" width="60" height="60" rx="13" fill="#557e70" stroke="none" stroke-width="2"/><text x="74" y="540" font-size="26" fill="#fff" font-weight="650">03</text><text x="143" y="517" font-size="27" fill="#243632" font-weight="650">Set a token limit</text><text x="143" y="551" font-size="24" fill="#557e70" font-weight="650">로어북별 토큰 예산</text><text x="143" y="582" font-size="23" fill="#65746f" font-weight="400">Shared pool, WI %, context %, or fixed tokens</text><text x="143" y="613" font-size="22" fill="#65746f" font-weight="400">전체 예산 공유 / 월드 정보 % / 컨텍스트 % / 고정 토큰</text><rect x="38" y="658" width="824" height="163" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><rect x="60" y="681" width="60" height="60" rx="13" fill="#557e70" stroke="none" stroke-width="2"/><text x="74" y="721" font-size="26" fill="#fff" font-weight="650">04</text><text x="143" y="698" font-size="27" fill="#243632" font-weight="650">Set retrieval preferences</text><text x="143" y="732" font-size="24" fill="#557e70" font-weight="650">검색·주입 방식 설정</text><text x="143" y="763" font-size="23" fill="#65746f" font-weight="400">Protect constants; optional vector score threshold</text><text x="143" y="794" font-size="22" fill="#65746f" font-weight="400">상시 주입 우선 보호; 벡터 유사도 임계값 선택</text><rect x="38" y="839" width="824" height="163" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><rect x="60" y="862" width="60" height="60" rx="13" fill="#557e70" stroke="none" stroke-width="2"/><text x="74" y="902" font-size="26" fill="#fff" font-weight="650">05</text><text x="143" y="879" font-size="27" fill="#243632" font-weight="650">Save settings</text><text x="143" y="913" font-size="24" fill="#557e70" font-weight="650">설정 저장</text><text x="143" y="944" font-size="23" fill="#65746f" font-weight="400">Group overrides are optional; test in your RP.</text><text x="143" y="975" font-size="22" fill="#65746f" font-weight="400">그룹 채팅 설정은 선택; RP에서 주입 결과 확인</text><text x="42" y="1016" font-size="20" fill="#65746f" font-weight="400">Illustrated guide / 기능 구성 안내 (not a screenshot)</text></svg>