<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280" font-family="Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="STLO / Setup Flow"><rect width="900" height="1280" fill="#f2f6f4"/><rect x="38" y="30" width="10" height="68" rx="5" fill="#557e70"/><text x="68" y="57" font-size="36" fill="#243632" font-weight="600">STLO / Setup Flow</text><text x="68" y="92" font-size="28" fill="#65746f" font-weight="400">설정 흐름 · AmbasaS2 fork</text><rect x="38" y="128" width="824" height="372" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="65" y="171" font-size="33" fill="#243632" font-weight="600">01  Set book budgets</text><text x="65" y="206" font-size="30" fill="#557e70" font-weight="600">책별 예산부터 설정</text><path d="M65 225H835" stroke="#cbd9d2" stroke-width="2"/><rect x="65" y="248" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="277" font-size="28" fill="#243632" font-weight="600">Extensions → Lorebook Budget Management</text><text x="83" y="307" font-size="26" fill="#557e70" font-weight="400">확장 메뉴 → 로어북 예산 관리</text><rect x="65" y="332" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="361" font-size="28" fill="#243632" font-weight="600">+ Add lorebook → set caps and priorities</text><text x="83" y="391" font-size="26" fill="#557e70" font-weight="400">책 추가 → 우선순위·예산 → 저장</text><rect x="65" y="416" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="445" font-size="28" fill="#243632" font-weight="600">Optional: Protect Always-On</text><text x="83" y="475" font-size="26" fill="#557e70" font-weight="400">필요하면 상시 주입 우선 보호 켜기</text><rect x="38" y="520" width="824" height="372" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="65" y="563" font-size="33" fill="#243632" font-weight="600">02  Choose how to recall</text><text x="65" y="598" font-size="30" fill="#557e70" font-weight="600">로어 호출 방식 선택</text><path d="M65 617H835" stroke="#cbd9d2" stroke-width="2"/><rect x="65" y="640" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="669" font-size="28" fill="#243632" font-weight="600">Native: leave Jev off</text><text x="83" y="699" font-size="26" fill="#557e70" font-weight="400">기본 키워드·벡터 사용 → Jev 끄기</text><rect x="65" y="724" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="753" font-size="28" fill="#243632" font-weight="600">Jev: open Lorebook Jev Recall</text><text x="83" y="783" font-size="26" fill="#557e70" font-weight="400">Jev 사용 → 로어북 Jev 호출 열기</text><rect x="65" y="808" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="837" font-size="28" fill="#243632" font-weight="600">Set profile, injection cap and source</text><text x="83" y="867" font-size="26" fill="#557e70" font-weight="400">프로필·주입 예산·판정 대상 설정</text><rect x="38" y="912" width="824" height="288" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="65" y="955" font-size="33" fill="#243632" font-weight="600">03  Roleplay as usual</text><text x="65" y="990" font-size="30" fill="#557e70" font-weight="600">평소처럼 롤플하기</text><path d="M65 1009H835" stroke="#cbd9d2" stroke-width="2"/><rect x="65" y="1032" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="1061" font-size="28" fill="#243632" font-weight="600">Check the latest recall report if needed</text><text x="83" y="1091" font-size="26" fill="#557e70" font-weight="400">필요하면 최근 호출 결과 확인</text><rect x="65" y="1116" width="770" height="70" rx="9" fill="#f2f6f4"/><text x="83" y="1145" font-size="28" fill="#243632" font-weight="600">On Jev error: Retry or Cancel reply</text><text x="83" y="1175" font-size="26" fill="#557e70" font-weight="400">Jev 오류 시 재시도 또는 답변 취소</text><text x="42" y="1248" font-size="23" fill="#65746f" font-weight="400">Illustrated guide / 실제 캡처가 아닌 구성도</text></svg>