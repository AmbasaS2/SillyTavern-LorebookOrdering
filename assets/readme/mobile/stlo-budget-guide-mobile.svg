<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1165" width="900" height="1165" font-family="Arial, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="STLO / Token Budget"><rect x="0" y="0" width="900" height="1165" rx="0" fill="#f2f6f4" stroke="none" stroke-width="2"/><rect x="38" y="29" width="10" height="63" rx="5" fill="#557e70" stroke="none" stroke-width="2"/><text x="68" y="55" font-size="33" fill="#243632" font-weight="650">예산 종류와 상시 항목의 우선 처리</text><text x="69" y="88" font-size="23" fill="#65746f" font-weight="400">STLO / Token Budget</text><rect x="38" y="115" width="824" height="167" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="153" font-size="27" fill="#243632" font-weight="650">하나의 전체 월드 정보 예산</text><text x="64" y="187" font-size="24" fill="#557e70" font-weight="650">One shared World Info budget</text><text x="64" y="224" font-size="23" fill="#65746f" font-weight="400">예시: 전체 8,000토큰; 개별 예산은 최대치입니다.</text><text x="64" y="255" font-size="22" fill="#65746f" font-weight="400">Example: 8,000 tokens total; each limit is a ceiling.</text><rect x="38" y="303" width="824" height="143" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="341" font-size="27" fill="#243632" font-weight="650">개별 제한 없음</text><text x="64" y="375" font-size="24" fill="#557e70" font-weight="650">Default / No separate cap</text><text x="64" y="405" font-size="23" fill="#65746f" font-weight="400">전체 예산 공유</text><text x="64" y="436" font-size="22" fill="#65746f" font-weight="400">Shares the global pool</text><rect x="38" y="462" width="824" height="143" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="500" font-size="27" fill="#243632" font-weight="650">전체 월드 정보 예산의 비율</text><text x="64" y="534" font-size="24" fill="#557e70" font-weight="650">% of World Info budget</text><text x="64" y="564" font-size="23" fill="#65746f" font-weight="400">전체 예산 8,000 × 25% = 2,000토큰</text><text x="64" y="595" font-size="22" fill="#65746f" font-weight="400">25% × 8,000 = 2,000 tokens</text><rect x="38" y="621" width="824" height="143" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="659" font-size="27" fill="#243632" font-weight="650">최대 컨텍스트 크기의 비율</text><text x="64" y="693" font-size="24" fill="#557e70" font-weight="650">% of max context</text><text x="64" y="723" font-size="23" fill="#65746f" font-weight="400">사용 가능 컨텍스트 40,000 × 5% = 2,000토큰</text><text x="64" y="754" font-size="22" fill="#65746f" font-weight="400">5% × 40,000 = 2,000 tokens</text><rect x="38" y="780" width="824" height="143" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="818" font-size="27" fill="#243632" font-weight="650">직접 토큰 수 지정</text><text x="64" y="852" font-size="24" fill="#557e70" font-weight="650">Fixed tokens</text><text x="64" y="882" font-size="23" fill="#65746f" font-weight="400">2,000 = 최대 2,000토큰</text><text x="64" y="913" font-size="22" fill="#65746f" font-weight="400">2,000 = at most 2,000 tokens</text><rect x="38" y="950" width="824" height="190" rx="18" fill="#fff" stroke="#cbd9d2" stroke-width="2"/><text x="64" y="989" font-size="27" fill="#243632" font-weight="650">상시 주입 우선 보호 (전역 · 기본 꺼짐)</text><text x="64" y="1023" font-size="24" fill="#557e70" font-weight="650">Protect Always-On (global, opt-in)</text><text x="64" y="1060" font-size="23" fill="#65746f" font-weight="400">상시 항목 먼저; 나머지 예산은 다른 항목에 사용.</text><text x="64" y="1091" font-size="22" fill="#65746f" font-weight="400">Constants first; optional entries use what remains.</text><text x="64" y="1121" font-size="21" fill="#9a6938" font-weight="650">A constant may still be trimmed / 상시 항목도 제외될 수 있음</text></svg>