name: Verify adaptive Jev recall
on:
  push:
    branches: [main, dev/jev-adaptive-recall, fix/stlo-metrics-lifecycle]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node --check index.js
