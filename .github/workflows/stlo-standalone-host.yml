name: Standalone STLO host regression
on:
  push:
    branches: [test/stlo-standalone-host]
  workflow_dispatch:
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: 82b64a45c34facbc98ff4b9f33c067d3ccab6a17
          path: .host-fixture
          persist-credentials: false
      - name: Prepare isolated host and browser
        run: |
          cd .host-fixture
          npm ci --omit=dev --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/stlo-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/stlo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run standalone group, AU, cancel and settings cases
        env:
          STLO_HOST_DIR: ${{ github.workspace }}/.host-fixture
          STLO_PLAYWRIGHT_MODULE: ${{ runner.temp }}/stlo-browser/node_modules/playwright/index.mjs
          STLO_HOST_EVIDENCE: ${{ runner.temp }}/stlo-host-evidence
        run: node ci/stlo-host-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-host-evidence
          path: ${{ runner.temp }}/stlo-host-evidence
          retention-days: 7
